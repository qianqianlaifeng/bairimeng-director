<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>白日梦导演台 · AI 影片导演工作台</title>
  <meta name="description" content="把剧本变成分镜、挑运镜看白模预演、动态分镜连播、时间线剪辑、一键生成 AI 视频提示词。纯前端，数据本地保存，可离线使用。">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-porcelain bgm-aurora">
  <noscript>
    <div style="padding:60px;text-align:center;font-family:sans-serif">
      <h1>🎬 白日梦导演台</h1>
      <p>本应用需要启用 JavaScript 才能运行。</p>
    </div>
  </noscript>
  <script>
    window.__bootErrors = [];
    window.addEventListener('error', function (e) {
      window.__bootErrors.push(e.message + ' @ ' + (e.filename || '') + ':' + e.lineno + ':' + e.colno);
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__bootErrors.push('REJECT: ' + ((e.reason && e.reason.message) || e.reason));
    });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>

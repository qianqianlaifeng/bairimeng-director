<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>白日梦导演台 · AI 影片导演工作台</title>
  <meta name="description" content="把剧本变成分镜、挑运镜看白模预演、动态分镜连播、时间线剪辑、一键生成 AI 视频提示词。纯前端，数据本地保存，可离线使用。">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <!-- 场景搭建 · 喵咛导演台（B 站玩具 MiorningDYT 原生重制，自包含主题） -->
  <link rel="stylesheet" href="css/miaoning.css">
</head>
<body class="theme-porcelain bgm-aurora">
  <noscript>
    <div style="padding:60px;text-align:center;font-family:sans-serif">
      <h1>🎬 白日梦导演台</h1>
      <p>本应用需要启用 JavaScript 才能运行。</p>
    </div>
  </noscript>
  <script>
    window.__bootErrors = [];
    window.addEventListener('error', function (e) {
      window.__bootErrors.push(e.message + ' @ ' + (e.filename || '') + ':' + e.lineno + ':' + e.colno);
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__bootErrors.push('REJECT: ' + ((e.reason && e.reason.message) || e.reason));
    });
  </script>
  <!-- 场景搭建 · 喵咛导演台（经典脚本，先于 ES module 执行；挂 window.MN/MN3D/MN3/MN_ICONS） -->
  <script src="js/mn-icons.js"></script>
  <!-- AI 搭建规则（5 条可复制/下载的说明书，挂 window.MN_RULES） -->
  <script src="js/mn-rules.js"></script>
  <!-- 道具库（多部件精细建模 + 2D/3D/白模三端共用的坐标约定，挂 window.MN_PROP_KINDS） -->
  <script src="js/mn-props.js"></script>
  <!-- 自动布局（防穿模：分离轴碰撞 + 就近让位，挂 window.MN_LAYOUT） -->
  <script src="js/mn-layout.js"></script>
  <!-- 分镜导入（CSV/TSV/Markdown/纯文本/JSON，挂 window.SHOT_IMPORT） -->
  <script src="js/import-shots.js"></script>
  <script src="js/miaoning.js"></script>
  <script src="js/miaoning3d.js"></script>
  <script src="js/miaoning_m3.js"></script>
  <!-- AI 搭景（按镜头描述自动生成场景 + 机位 + 走位，挂 window.AI_SCENE） -->
  <script src="js/ai-scene.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
